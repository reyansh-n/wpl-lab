<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration - CityCare Hospital</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center;">
  <header>
    <h1>CityCare Hospital</h1>
    <h2>Patient Registration</h2>
  </header>

  <nav>
    <a href="index.html">Home</a> |
    <a href="login.html">Login</a> |
    <a href="catalogue.html">Doctors &amp; Services</a> |
    <a href="register.html">Registration</a> |
    <a href="timetable.html">Class Timetable</a>
  </nav>
  <hr>

  <main>
    <h2>New Patient Registration</h2>
    <form action="#" method="post">
      <p><label for="fullname">Full Name:</label><br><input type="text" id="fullname" name="fullname" required></p>
      <p><label for="email">Email Address:</label><br><input type="email" id="email" name="email" required></p>
      <p><label for="phone">Phone Number:</label><br><input type="tel" id="phone" name="phone" required></p>
      <p><label for="dob">Date of Birth:</label><br><input type="date" id="dob" name="dob" required></p>
      <p>
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male"><label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female"><label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other"><label for="other">Other</label>
      </p>
      <p>
        <label for="bloodgroup">Blood Group:</label><br>
        <select id="bloodgroup" name="bloodgroup">
          <option value="">Select Blood Group</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
        </select>
      </p>
      <p><label for="address">Address:</label><br><textarea id="address" name="address" rows="4" cols="30"></textarea></p>
      <p><label for="emergency">Emergency Contact:</label><br><input type="tel" id="emergency" name="emergency"></p>
      <p><label for="password">Create Password:</label><br><input type="password" id="password" name="password" required></p>
      <p><input type="submit" value="Register"> <input type="reset" value="Clear"></p>
    </form>
  </main>

  <hr>
  <footer><p>&copy; 2026 CityCare Hospital</p></footer>
</body>
</html>
