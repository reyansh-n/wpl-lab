<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - CityCare Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CityCare Hospital</h1>
        <p>Quality Healthcare, Compassionate Care</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="catalogue.html">Doctors &amp; Services</a></li>
            <li><a href="register.html" class="active">Registration</a></li>
            <li><a href="timetable.html">Timetable</a></li>
        </ul>
    </nav>

    <main>
        <section class="card">
            <h2>New Patient Registration</h2>
            <p style="margin-bottom:1.2rem;">Fill in your details to create an account</p>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-options">
                        <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
                        <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
                        <label for="other"><input type="radio" id="other" name="gender" value="other"> Other</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bloodgroup">Blood Group:</label>
                    <select id="bloodgroup" name="bloodgroup">
                        <option value="">Select Blood Group</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <textarea id="address" name="address" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="emergency">Emergency Contact:</label>
                    <input type="tel" id="emergency" name="emergency">
                </div>
                <div class="form-group">
                    <label for="password">Create Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-buttons">
                    <input type="submit" value="Register" class="btn btn-primary">
                    <input type="reset" value="Clear" class="btn btn-secondary">
                </div>
                <p class="form-link">Already registered? <a href="login.html">Login here</a></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CityCare Hospital. All Rights Reserved.</p>
    </footer>

</body>
</html>
